- name: configure the DB server
  hosts: "172.31.35.66"
  vars:
    mysql_server_host: "172.31.35.66"
    mysql_admin_user: "root"
    #mysql_admin_password: ""
    target_db_user: "root"
    target_db_password: "ExpenseApp@1"
    allowed_source_ip: "%"

  vars_prompt:
  - name: mysql_root_password
    prompt: please enter Mysql root login_password
    private: no

  tasks:
  - name: check version is installed or Not
    ansible.builtin.command: sudo mysqld --version
    register: Version
    ignore_errors: true

  - name: print version info
    ansible.builtin.debug:
      msg: "{{Version}}"

  - name: install mysql-community
    ansible.builtin.command: sudo dnf install -y https://dev.mysql.com/get/mysql80-community-release-el9-1.noarch.rpm
    when: Version.rc != 0
  
  - name: import rpm
    ansible.builtin.command: sudo rpm --import https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
    when: Version.rc != 0

  - name: install mysql-community
    ansible.builtin.command: sudo dnf install -y mysql-community-server
    when: Version.rc != 0

  - name: Run & enable mysql
    ansible.builtin.service:
      name: mysqld
      state: started
      enabled: yes
    become: yes

  - name: Ensure python3-pip is installed
    ansible.builtin.dnf:
      name: python3-pip
      state: present
    become: yes
  - name: install python mysql dependencies
    ansible.builtin.pip:
      name: 
      - PyMySQL
      - cryptography
      executable: pip3.9

  - name: Configure MySQL user privileges remotely over the network
    community.mysql.mysql_user:
        # 1. Connection Details (How Ansible talks to the server over the wire)
        login_host: "{{ mysql_server_host }}"
        login_port: 3306
        login_user: "{{ mysql_admin_user }}"
        login_password: "{{ mysql_root_password }}"
    ignore_errors: true
    register: mysql_connection_timeout

  - name: print info
    ansible.builtin.debug:
      msg: "{{mysql_connection_timeout}}"
  - name: capture root_password_before changing
    ansible.builtin.command: sudo grep 'temporary password' /var/log/mysqld.log
    register: temp_password
    changed_when: false
  - name: Set password variable safely
    ansible.builtin.set_fact: 
        # We target the stdout directly and extract everything after the final space
      actual_password: "{{ temp_password.stdout | regex_findall('root@localhost:\\s*(\\S+)') | last | default('NOT_FOUND') }}"



  - name: print temp_password
    ansible.builtin.debug:
      msg: "{{actual_password}}"

  - name: Ensure pexpect is installed for the expect module
    ansible.builtin.pip:
      name: pexpect
    become: true

  - name: Run mysql_secure_installation automatically
    ansible.builtin.expect:
      command: sudo mysql_secure_installation
      responses:
          # We append \n to simulate hitting the 'Enter' key
          '(?i)password for user root': "{{ actual_password }}\n"
          
          # Simplified regex matches for subsequent prompts to prevent hanging
          '(?i)press y\|y for yes': "No\n"
          '(?i)new password:': "{{mysql_root_password}}\n"
          '(?i)re-enter new password:': "{{mysql_root_password}}\n"
          '(?i)remove anonymous users': "Y\n"
          '(?i)disallow root login remotely': "Y\n"
          '(?i)remove test database': "Y\n"
          '(?i)reload privilege tables now': "Y\n"
    no_log: false
    when: mysql_connection_timeout.failed is true

        # # 2. Target Privileges (What you are modifying inside the DB)
        # name: "{{ target_db_user }}"
        # password: "{{ mysql_root_password }}"
        # host: "{{ allowed_source_ip }}"   # Use "%" if you want them to connect from anywhere
        # priv: "*.*:ALL,GRANT"
        # state: present
