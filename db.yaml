    - name: Configure MySQL 8.0 Community Repository File
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/mysql-community.repo
        content: |
          [mysql80-community]
          name=MySQL 8.0 Community Server
          baseurl=https://mysql.com
          enabled=1
          gpgcheck=1
          gpgkey=https://mysql.com
        owner: root
        group: root
        mode: '0644'

    - name: Install MySQL Server Package
      ansible.builtin.dnf:
        name: mysql-community-server
        state: present
        update_cache: yes
        disable_gpg_check: no

    - name: Start and Enable MySQL Service
      ansible.builtin.service:
        name: mysqld
        state: started
        enabled: yes