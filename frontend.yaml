- name: confiure frontend server
  hosts: localhost
  become: true
  tasks: 
  - name: install nginx server
    ansible.builtin.dnf:
      name: nginx
      state: latest
  - name: start and enable nginx
    ansible.builtin.service:
      name: nginx
      state: restarted
      enabled: yes
