- name: backend configure
  hosts: localhost
  become: yes
  vars:
    node_package_name:  "nodejs20"
    login_host: localhost
  vars_prompt:
  - name: login_password
    prompt: please enter Mysql root login_password
    private: no
  tasks:
  - name: install nodejs version 20
    ansible.builtin.dnf:
      name: "{{node_package_name}}"
      state: present

  - name: Verify Node.js installation
    ansible.builtin.command: node -v
    register: node_version_output
    changed_when: false

  - name: Print Node.js version
    ansible.builtin.debug:
      var: node_version_output.stdout

  - name: create expense user
    ansible.builtin.user:
      name: expense

  - name: Create App directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: download backend code
    ansible.builtin.get_url:
      url: https://expense-builds.s3.us-east-1.amazonaws.com/expense-backend-v2.zip
      dest: /tmp/backend.zip

  - name: unzip backend code
    ansible.builtin.unarchive:  
      src: /tmp/backend.zip
      dest: /app
    changed_when: false
      #remote_src: yes

  - name: install npm dependencies
    ansible.builtin.command: npm install
    args:
      chdir: /app
    changed_when: false

  - name: copy backend service
    ansible.builtin.copy:
      src: backend.service
      dest: /etc/systemd/system/backend.service
  - name: install python mysql dependencies
    ansible.builtin.pip:
      name:
      - PyMySQL
      - cryptography
      executable: pip3.9 
  - name: import data into sql
    community.mysql.mysql_db:
      login_user: "root"
      login_password: "{{login_password}}"
      login_host: "{{login_host}}"
      target: /app/schema/backend.sql
      state: import